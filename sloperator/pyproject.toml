[project]
name = "sloperator"
version = "0.1.0"
description = "A tree-walking interpreter for SlopLang."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.18", "ty>=0.0.51"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
